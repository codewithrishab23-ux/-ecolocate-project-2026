{% extends "base.html" %}

{% block title %}Administrator Sign In | EcoLocate{% endblock %}

{% block content %}
<section class="auth-wrapper" style="background: radial-gradient(circle at 50% 10%, rgba(254, 243, 199, 0.35) 0%, rgba(248, 250, 249, 1) 60%);">
  <div class="auth-card" style="border-top: 4px solid var(--warning);">
    <div class="auth-header">
      <div style="width: 52px; height: 52px; border-radius: 50%; background-color: #fef3c7; color: #b45309; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto; border: 1px solid #fde68a;">
        <svg width="26" height="26" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
        </svg>
      </div>
      <h1 class="auth-title">Admin Management Portal</h1>
      <p class="auth-desc">Authorized administrators only. Separate secure session required.</p>
    </div>

    <form class="auth-form" method="POST" action="{{ url_for('admin_login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="admin-username" class="form-label">Admin Username</label>
        <input type="text" id="admin-username" name="username" class="form-input" placeholder="admin_user" required autocomplete="username" value="{{ request.form.get('username', '') }}">
      </div>

      <div class="form-group">
        <label for="admin-password" class="form-label">Password</label>
        <div class="password-input-group">
          <input type="password" id="admin-password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="password-toggle-btn" data-target="admin-password" aria-label="Toggle password visibility">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="padding: 0.85rem; background-color: #0e3b2e;">
        Verify & Sign In as Admin
      </button>

      <div class="auth-footer" style="margin-top: 1.5rem;">
        Are you a general community user? <a href="{{ url_for('login') }}">Member Sign In</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
